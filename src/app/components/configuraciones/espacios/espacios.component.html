<h4 class="mb-32">Categorias</h4>

<form [formGroup]="laboratorioForm">
  <mat-form-field appearance="outline" style="width: 32%;">
    <mat-label>Nombre</mat-label>
    <input matInput required formControlName="aula">
  </mat-form-field>&nbsp;

  <mat-form-field appearance="outline" style="width: 32%;">
    <mat-label>Edificio</mat-label>
    <input matInput required formControlName="edificio">
  </mat-form-field>&nbsp;

  <mat-form-field appearance="outline" style="width: 32%;">
    <mat-label>Capacidad</mat-label>
    <input matInput required type="number" formControlName="capacidad">
  </mat-form-field>&nbsp;

  <button  *ngIf="permisosService.puede('Espacios', 'crear')" mat-raised-button color="primary" (click)="guardar()">Guardar</button>

  <ng-container *ngIf="currentLaboratorio.id && permisosService.puede('Categorias', 'editar')">&nbsp;
    <button mat-raised-button color="warn" (click)="cancelarEdicion()">Cancelar acción</button>
  </ng-container>
</form>


   <!-- Spinner de carga  -->
   <div *ngIf="mostrarSpinner" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Cargando espacios...</span>
  </div>


<div class="table-responsive" *ngIf="!mostrarSpinner">
  <table mat-table [dataSource]="laboratorioList">

    <!-- Position Column -->
    <ng-container matColumnDef="laboratorio">
      <th mat-header-cell *matHeaderCellDef > Laboratorio </th>
      <td mat-cell *matCellDef="let element"> {{element.aula}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="edificio">
      <th mat-header-cell *matHeaderCellDef> Edificio </th>
      <td mat-cell *matCellDef="let element"> {{element.edificio}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="capacidad">
      <th mat-header-cell *matHeaderCellDef > Capacidad </th>
      <td mat-cell *matCellDef="let element" > {{element.capacidad}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let item">
        <button  *ngIf="permisosService.puede('Categorias', 'editar')" mat-button class="btnEditTable" (click)="setValueLaboratorio(item)">
          <div class="flex justify-content-center">
            <mat-icon>edit</mat-icon>
          </div>
        </button>
        <button  *ngIf="permisosService.puede('Categorias', 'eliminar')" mat-button class="btnDeleteTable" (click)="deleteLaboratorio(item)">
          <div class="flex justify-content-center">
            <mat-icon>delete</mat-icon>
          </div>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
