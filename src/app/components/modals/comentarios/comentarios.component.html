<div class="cm-backdrop" (click)="onBackdropClick($event)" role="dialog" aria-modal="true" aria-labelledby="cm-titulo">
  <div class="cm-modal">
    <!-- Encabezado -->
    <header class="cm-header">
      <div class="cm-header-info">
        <div class="cm-header-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div>
          <h2 class="cm-titulo" id="cm-titulo">Comentarios</h2>
          <p class="cm-subtitulo" *ngIf="referencia">{{ objRecibido.noFormulario }}</p>
        </div>
      </div>
      <button type="button" class="cm-cerrar" (click)="onCerrar()" aria-label="Cerrar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- Hilo de comentarios -->
    <div class="cm-hilo">
      <ng-container *ngIf="comentarioList.length > 0; else sinComentarios">
        <article class="cm-comentario" *ngFor="let c of comentarioList; trackBy: trackById">
          <div class="cm-avatar" aria-hidden="true">
            {{ iniciales(c.creadoPor) }}
          </div>
          <div class="cm-comentario-cuerpo">
            <div class="cm-comentario-meta">
              <span class="cm-autor">{{ c.creadoPor }}</span>
              <!-- <span class="cm-badge" *ngIf="c.esSupervisor">Supervisor</span> -->
              <span class="cm-fecha">{{ c.fechaCreacion | date: 'dd/MM/yyyy, HH:mm' }}</span>
            </div>
            <p class="cm-texto">{{ c.comentario }}</p>
          </div>
        </article>
      </ng-container>

      <ng-template #sinComentarios>
        <div class="cm-vacio">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <p>Aún no hay comentarios. Sé el primero en dejar uno.</p>
        </div>
      </ng-template>
    </div>

    <!-- Composer -->
    <footer class="cm-footer">
      <form [formGroup]="form">

        <label class="cm-label" for="cm-input">Escribir comentario</label>
        <textarea id="cm-input" class="cm-input" rows="3" placeholder="Escribe tu comentario para esta adición..."
          formControlName="comentario" [disabled]="guardando"></textarea>

      </form>
      <div class="cm-acciones">
        <button type="button" class="cm-btn cm-btn--secundario" (click)="onCerrar()">
          Cancelar
        </button>
        <button type="button" class="cm-btn cm-btn--primario" [disabled]="!puedeEnviar" (click)="onEnviar()">
          {{ guardando ? 'Enviando...' : 'Enviar comentario' }}
        </button>
      </div>
    </footer>
  </div>
</div>
